[pytest]
# Lives inside tests/ so it travels with CIBW_TEST_SOURCES_LINUX=tests into
# cibuildwheel's temporary test cwd; a package/pyproject.toml ini would not be
# copied there and so would never apply during the in-container gate.
addopts = --strict-markers --strict-config -ra
markers =
    gpu: test requires a usable CUDA device
