[build-system]
requires = [
    "setuptools>=70.1.0,<80.0",
    "wheel",
    "torch>=2.4.0",
    "ninja",
]
build-backend = "setuptools.build_meta"

[project]
name = "concomtorch"
dynamic = ["version", "dependencies"]
description = "GPU-accelerated connected component labeling for PyTorch tensors using Block-based Komura Equivalence (BKE)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Ben Elfner", email = "belfner@belfner.com" }
]
keywords = ["pytorch", "cuda", "connected-components", "image-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
]
# Installed with the repaired wheel via CIBW_TEST_EXTRAS_LINUX=test during the
# in-container test gate. torch is intentionally excluded: the matching
# +cuXXX CUDA build is installed in CIBW_BEFORE_TEST_LINUX from the pytorch
# index, because PyPI does not carry that local-version build.
test = [
    "pytest>=8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.setuptools]
packages = ["concomtorch"]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.package-data]
concomtorch = ["*.so", "*.pyd"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py310"
