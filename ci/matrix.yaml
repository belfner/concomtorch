# Build matrix for concomtorch wheels.
#
# torch_min is the lowest torch version to target. ci/detect.py enumerates
# every cuda variant and every python ABI (subject to python_min) that PyTorch
# publishes on download.pytorch.org (via torch-wheel-index) for torch versions
# at or above it. ci/plan.py then narrows that set to the latest patch of each
# torch minor and diffs it against the on-disk wheelhouse, so the wheels
# actually built are one per (torch_minor, cuda, python) at the newest patch.

torch_min: '2.6.0'

# Lowest CPython minor to build. Every python ABI PyTorch publishes for a
# selected torch version at or above this is included.
python_min: '3.10'

# Lowest CUDA compute capability (SM) to emit device code for. At wheel build
# time package/setup.py queries `nvcc --list-gpu-code`, keeps every SM at or
# above this floor, sorts ascending, and auto-populates TORCH_CUDA_ARCH_LIST
# (plus a PTX fallback for the highest arch). 7.5 is Turing (Tesla T4 / RTX 20
# series); the floor also tracks per-toolkit drops automatically.
compute_min: '7.5'

# Docker image pool tuning.
# max_parallel_builds caps concurrent `docker build` invocations during warmup.
# max_resident_images caps how many manylinux+CUDA images may live on disk at once.
# Each image is ~5-15GB. Images for cuda variants in the active plan are kept.
docker:
  max_parallel_builds: 2
  max_resident_images: 3
