[project]
name = "concomtorch-ops"
version = "0.0.0"
description = "Build, publish, and orchestration tooling for the concomtorch wheel matrix. The wheel itself lives under ./package."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "torch-wheel-index>=0.2.0",
    "cibuildwheel>=2.21.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py310"
